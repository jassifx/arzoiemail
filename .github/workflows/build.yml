# Builds the hMailServer installer on a GitHub-hosted VS2026 runner.
#
# The steps mirror the TeamCity job this replaces: stamp the version into the sources, build
# the server, build the administration tools, and compile hMailServer64.iss with Inno Setup
# into a setup executable. When a manual run on master asks for it, SignPath signs
# hMailServer's own binaries before they are packed, and then the installer itself.
#
# The installer is then handed to tests.yml, which installs it on a runner of its own and
# runs the regression tests against it, before the publish job releases it under its
# version-stamped name. A failing suite therefore stops the release.
#
# The expensive part of a hMailServer build is not the server itself (a few minutes) but the
# four third-party libraries it links against - OpenSSL, Boost, libpq and libmariadb - which
# take 35-45 minutes to build from source. Each is therefore cached separately under
# %hMailServerLibs%, keyed on the version the repository pins plus the script that builds it,
# so a normal run restores them and only compiles hMailServer.
#
# About the runner: windows-2025-vs2026 ships Visual Studio 2026 (18.x), whose default
# compiler (v145) hMailServer's projects are built with, together with the ATL and the
# Spectre-mitigated libraries for it that the projects need. Nothing has to be installed into
# Visual Studio; the workflow only checks that they are there.
name: Build

on:
  # Only branches that live in this repository. Pull requests are deliberately not built:
  # a fork's pull request would otherwise run its code on our runners and against our caches.
  push:
    branches:
      - master
      - 'claude/**'
      - 'feature/**'
      - 'techdebt/**'
      - 'bugfix/**'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Product version, major.minor.patch. Defaults to the VERSION file.'
        required: false
        default: ''
      build:
        description: 'Build number. Defaults to the run number of this workflow.'
        required: false
        default: ''
      signing:
        description: 'SignPath signing policy. Signing is only allowed on master.'
        type: choice
        options:
          - none
          - test-signing
          - release-signing
        default: none

# Read-only token. Nothing here writes to the repository; checkout is the only consumer.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Superseding a branch build is what this is for. master is exempt: its builds are the
  # ones that get published, and cancelling one leaves that commit with no installer.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Where the library build scripts download and build into. Anywhere outside the working
  # directory will do; the build scripts and hMailServer.vcxproj both read this variable.
  hMailServerLibs: C:\hMailLibs
  # The v145 toolset the projects are built with (14.5x), and so the oldest C++ runtime the
  # installer may ship. A later one is fine - the 14.x runtimes are backwards compatible.
  REDIST_MIN_VERSION: '14.50'
  # Inno Setup, taken from its GitHub release rather than Chocolatey, which lags behind it.
  # The download is checked against the SHA-256 GitHub publishes for the release asset.
  INNOSETUP_VERSION: 6.7.3
  INNOSETUP_SHA256: 9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732
  # The build number continues the series TeamCity produced, which ended at 2869. GitHub's
  # run number cannot be seeded, so it is offset by that instead: build = offset + run number.
  # The run number is counted per workflow file path, so renaming this file restarts it at 1
  # and the offset has to be re-based on the last build number published.
  BUILD_NUMBER_OFFSET: 2869
  # No build may be numbered at or below the last TeamCity build. See the check that uses it.
  BUILD_NUMBER_FLOOR: 2869
  # Code signing through SignPath, requested with the signing input of a manual run.
  SIGNPATH_ORGANIZATION_ID: 4e2f3324-9b85-4dba-8e7c-5e799e7e7ba7
  SIGNPATH_PROJECT: hmailserver
  # How long to wait for each signing request. release-signing waits for manual approval.
  SIGNPATH_TIMEOUT_SECONDS: 3600

jobs:
  build:
    name: Release x64
    # The runner image is written once, here. It is both the label the job runs on and part
    # of every library cache key, and `runs-on` does not accept the `env` context - only
    # `matrix` and a few others - so a one-entry matrix is what makes the two the same
    # string. `name:` above keeps the matrix value out of the job title in the web UI.
    strategy:
      matrix:
        image: [windows-2025-vs2026]
    runs-on: ${{ matrix.image }}
    # A signed build also waits for up to two SignPath approvals.
    timeout-minutes: ${{ inputs.signing && inputs.signing != 'none' && 210 || 90 }}
    # The SignPath API token lives in the signing environment, which only master may use, so
    # asking for signing on another branch fails the job. Unsigned runs use no environment.
    environment: ${{ inputs.signing && inputs.signing != 'none' && 'signing' || '' }}
    # actions: read lets SignPath fetch the unsigned artifacts from this run.
    permissions:
      contents: read
      actions: read
    env:
      SIGNING_POLICY: ${{ inputs.signing || 'none' }}
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.product.outputs.version }}
      build: ${{ steps.product.outputs.build }}
      # Passed to tests.yml so the tests run on the same image, rather than it naming one
      # of its own that could drift from this.
      runner-image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leaving the token in .git/config would only widen what a
          # later step - or a build script - could reach.
          persist-credentials: false

      - name: Create the library folder
        run: New-Item -ItemType Directory -Force -Path $env:hMailServerLibs | Out-Null

      # The projects use PlatformToolset v145, the default compiler of Visual Studio 2026,
      # with ATL linked statically and the Spectre-mitigated runtime libraries. All three come
      # with the image; this fails early, with the reason, if an image update drops one.
      - name: Locate Visual Studio and the v145 toolset
        id: vs
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instance = (& $vswhere -products '*' -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | Out-String | ConvertFrom-Json) | Select-Object -First 1
          if (-not $instance) { throw "No Visual Studio 2026 with the x64 C++ toolchain was found." }
          "Building with $($instance.displayName) $($instance.installationVersion)"

          # The version MSBuild selects for the default toolset of this Visual Studio.
          $defaultFile = Join-Path $instance.installationPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
          $version = (Get-Content $defaultFile -Raw).Trim()
          if (-not $version.StartsWith('14.5')) { throw "The default MSVC toolset of $($instance.installationPath) is $version, not a 14.5x (v145) one." }
          $toolset = Join-Path $instance.installationPath "VC\Tools\MSVC\$version"
          "v145 toolset: $version"

          $required = [ordered]@{
              'the x64 compiler'                  = 'bin\Hostx64\x64\cl.exe'
              'ATL (UseOfAtl=Static)'             = 'atlmfc\lib\x64\atls.lib'
              'the Spectre-mitigated runtime'     = 'lib\spectre\x64\libcmt.lib'
              'the Spectre-mitigated ATL'         = 'atlmfc\lib\spectre\x64\atls.lib'
          }
          foreach ($item in $required.GetEnumerator()) {
              if (-not (Test-Path (Join-Path $toolset $item.Value))) {
                  throw "$($item.Key) is missing from $toolset ($($item.Value)). The image needs the VC.ATL, VC.Runtimes.x86.x64.Spectre and VC.ATL.Spectre components of Visual Studio 2026."
              }
          }

      - name: Read the pinned library versions
        id: versions
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\Get-LibraryVersions.ps1

      - name: Determine the version and build number
        id: product
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
        run: |
          # TeamCity kept these in build parameters; here the version lives in the VERSION
          # file and the build number is the offset run number, both overridable on a manual
          # run.
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION.Trim() } else { (Get-Content VERSION -Raw).Trim() }
          $build = if ($env:INPUT_BUILD) { $env:INPUT_BUILD.Trim() } else { [string]([int]$env:GITHUB_RUN_NUMBER + [int]$env:BUILD_NUMBER_OFFSET) }

          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "The version must be major.minor.patch, was '$version'." }
          if ($build -notmatch '^\d+$') { throw "The build number must be numeric, was '$build'." }

          # Catches an offset that was dropped or mis-edited, which would renumber new builds
          # back into the range TeamCity already published.
          if ([int]$build -le [int]$env:BUILD_NUMBER_FLOOR) { throw "The build number must continue the series after $env:BUILD_NUMBER_FLOOR, was $build. Check BUILD_NUMBER_OFFSET." }

          "Building hMailServer $version-B$build"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "build=$build"

      # One cache per library, so bumping one version does not throw the others away. Each key
      # carries the pinned version, the scripts that produce the build, and the runner image;
      # libpq and libmariadb link against OpenSSL, so their keys carry its version too, and
      # Boost's carries the toolset its libraries are name-tagged with.
      #
      # Deliberately no restore-keys: a partial match would restore a tree built from a
      # different version or toolset, which is worse than rebuilding.
      #
      # Restore and save are separate actions rather than the combined actions/cache, because
      # the combined one saves in a post step that has no idea whether the job succeeded. A
      # library build that died halfway would have its half-built tree stored under the key
      # that means "this library is built", and with no restore-keys to fall back to, every
      # later run on the branch would restore that and fail at link time instead of rebuilding.
      # The matching save steps sit after each build below, and only run when it worked.
      - name: Restore OpenSSL
        id: cache-openssl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.hMailServerLibs }}\${{ steps.versions.outputs.openssl_dir }}
          key: openssl-${{ steps.versions.outputs.openssl }}-${{ matrix.image }}-${{ hashFiles('libraries/build-openssl.ps1', 'libraries/build-common.ps1') }}

      - name: Restore Boost
        id: cache-boost
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.hMailServerLibs }}\${{ steps.versions.outputs.boost_dir }}
          key: boost-${{ steps.versions.outputs.boost }}-msvc14.5-${{ matrix.image }}-${{ hashFiles('libraries/build-boost.ps1', 'libraries/build-common.ps1') }}

      - name: Restore PostgreSQL (libpq)
        id: cache-pgsql
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.hMailServerLibs }}\${{ steps.versions.outputs.postgresql_dir }}
          key: pgsql-${{ steps.versions.outputs.postgresql }}-ssl${{ steps.versions.outputs.openssl }}-${{ matrix.image }}-${{ hashFiles('libraries/build-pgsql.ps1', 'libraries/build-common.ps1') }}

      - name: Restore MariaDB Connector/C
        id: cache-mariadb
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.hMailServerLibs }}\${{ steps.versions.outputs.mariadb_dir }}
          key: mariadb-${{ steps.versions.outputs.mariadb }}-ssl${{ steps.versions.outputs.openssl }}-${{ matrix.image }}-${{ hashFiles('libraries/build-mariadb.ps1', 'libraries/build-common.ps1') }}

      # 7-Zip is downloaded rather than compiled, so its key carries no runner image: the
      # same prebuilt x64 binary is correct on every one of them.
      - name: Restore 7-Zip
        id: cache-sevenzip
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.hMailServerLibs }}\${{ steps.versions.outputs.sevenzip_dir }}
          key: sevenzip-${{ steps.versions.outputs.sevenzip }}-${{ hashFiles('libraries/build-7zip.ps1', 'libraries/build-common.ps1') }}

      - name: Restore the .NET Desktop Runtime installer
        id: cache-dotnet-runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.hMailServerLibs }}\${{ steps.versions.outputs.dotnet_runtime_dir }}
          key: dotnet-runtime-${{ steps.versions.outputs.dotnet_runtime }}-${{ hashFiles('libraries/fetch-dotnet-runtime.ps1', 'libraries/build-common.ps1') }}

      # Each build step prunes its tree before it is saved. What is kept is exactly what
      # hMailServer.vcxproj and post-build.bat reference; the rest is source and intermediates
      # that would multiply the cache size (Boost alone is ~2 GB unpruned against ~500 MB
      # pruned). Pruning runs inside the build step so that a prune which removes too much
      # fails the step, and the save below is then skipped along with it.
      #
      # The version and folder name reach the scripts as environment variables rather than
      # being pasted into the script body: the value is what varies, and it has no business
      # being able to change what the shell parses.
      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        env:
          LIB_VERSION: ${{ steps.versions.outputs.openssl }}
          LIB_DIR: ${{ steps.versions.outputs.openssl_dir }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File libraries\build-openssl.ps1 -Version $env:LIB_VERSION
          if ($LASTEXITCODE -ne 0) { throw "build-openssl.ps1 failed with exit code $LASTEXITCODE" }

          $root = Join-Path $env:hMailServerLibs $env:LIB_DIR
          Get-ChildItem $root -Force | Where-Object { $_.Name -ne 'out64' } | Remove-Item -Recurse -Force
          foreach ($required in @('out64\include\openssl\ssl.h', 'out64\lib\libssl.lib', 'out64\bin\libssl-3-x64.dll')) {
              if (-not (Test-Path (Join-Path $root $required))) { throw "Pruning removed something needed: $required" }
          }

      - name: Save OpenSSL
        if: success() && steps.cache-openssl.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.hMailServerLibs }}\${{ steps.versions.outputs.openssl_dir }}
          key: ${{ steps.cache-openssl.outputs.cache-primary-key }}

      - name: Build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        env:
          LIB_VERSION: ${{ steps.versions.outputs.boost }}
          LIB_DIR: ${{ steps.versions.outputs.boost_dir }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File libraries\build-boost.ps1 -Version $env:LIB_VERSION
          if ($LASTEXITCODE -ne 0) { throw "build-boost.ps1 failed with exit code $LASTEXITCODE" }

          # hMailServer.vcxproj references only the headers (boost_<ver>) and stage\lib.
          $root = Join-Path $env:hMailServerLibs $env:LIB_DIR
          Get-ChildItem $root -Force | Where-Object { $_.Name -notin @('boost', 'stage') } | Remove-Item -Recurse -Force
          if (-not (Test-Path (Join-Path $root 'boost\version.hpp'))) { throw "Pruning removed the Boost headers." }
          if (-not (Get-ChildItem (Join-Path $root 'stage\lib') -Filter '*vc145*.lib')) { throw "No vc145-tagged libraries in stage\lib - Boost was built with the wrong toolset." }

      - name: Save Boost
        if: success() && steps.cache-boost.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.hMailServerLibs }}\${{ steps.versions.outputs.boost_dir }}
          key: ${{ steps.cache-boost.outputs.cache-primary-key }}

      - name: Build PostgreSQL (libpq)
        if: steps.cache-pgsql.outputs.cache-hit != 'true'
        env:
          LIB_VERSION: ${{ steps.versions.outputs.postgresql }}
          LIB_DIR: ${{ steps.versions.outputs.postgresql_dir }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File libraries\build-pgsql.ps1 -Version $env:LIB_VERSION
          if ($LASTEXITCODE -ne 0) { throw "build-pgsql.ps1 failed with exit code $LASTEXITCODE" }

          # Keep the built libpq plus the headers the project includes (src\include and
          # src\interfaces\libpq); the rest of the PostgreSQL source tree is not referenced.
          $root = Join-Path $env:hMailServerLibs $env:LIB_DIR
          Get-ChildItem $root -Force | Where-Object { $_.Name -notin @('Release', 'src') } | Remove-Item -Recurse -Force
          Get-ChildItem (Join-Path $root 'src') -Force | Where-Object { $_.Name -notin @('include', 'interfaces') } | Remove-Item -Recurse -Force
          Get-ChildItem (Join-Path $root 'src\interfaces') -Force | Where-Object { $_.Name -ne 'libpq' } | Remove-Item -Recurse -Force
          foreach ($required in @('Release\libpq\libpq.dll', 'Release\libpq\libpq.lib', 'src\interfaces\libpq\libpq-fe.h')) {
              if (-not (Test-Path (Join-Path $root $required))) { throw "Pruning removed something needed: $required" }
          }

      - name: Save PostgreSQL (libpq)
        if: success() && steps.cache-pgsql.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.hMailServerLibs }}\${{ steps.versions.outputs.postgresql_dir }}
          key: ${{ steps.cache-pgsql.outputs.cache-primary-key }}

      - name: Build MariaDB Connector/C
        if: steps.cache-mariadb.outputs.cache-hit != 'true'
        env:
          LIB_VERSION: ${{ steps.versions.outputs.mariadb }}
          LIB_DIR: ${{ steps.versions.outputs.mariadb_dir }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File libraries\build-mariadb.ps1 -Version $env:LIB_VERSION
          if ($LASTEXITCODE -ne 0) { throw "build-mariadb.ps1 failed with exit code $LASTEXITCODE" }

          # Only the DLL is shipped; hMailServer loads it at run time and declares the
          # mysql_* functions it uses itself, so it needs no headers from this source tree.
          # Keep just the folder chain leading to the DLL by dropping the siblings at each level.
          $root = Join-Path $env:hMailServerLibs $env:LIB_DIR
          Get-ChildItem $root -Force | Where-Object { $_.Name -ne 'build64' } | Remove-Item -Recurse -Force
          Get-ChildItem (Join-Path $root 'build64') -Force | Where-Object { $_.Name -ne 'libmariadb' } | Remove-Item -Recurse -Force
          Get-ChildItem (Join-Path $root 'build64\libmariadb') -Force | Where-Object { $_.Name -ne 'RelWithDebInfo' } | Remove-Item -Recurse -Force
          if (-not (Test-Path (Join-Path $root 'build64\libmariadb\RelWithDebInfo\libmariadb.dll'))) { throw "Pruning removed libmariadb.dll." }

      - name: Save MariaDB Connector/C
        if: success() && steps.cache-mariadb.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.hMailServerLibs }}\${{ steps.versions.outputs.mariadb_dir }}
          key: ${{ steps.cache-mariadb.outputs.cache-primary-key }}

      # No pruning here: build-7zip.ps1 already keeps only the two files that are installed.
      - name: Fetch 7-Zip
        if: steps.cache-sevenzip.outputs.cache-hit != 'true'
        env:
          LIB_VERSION: ${{ steps.versions.outputs.sevenzip }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File libraries\build-7zip.ps1 -Version $env:LIB_VERSION
          if ($LASTEXITCODE -ne 0) { throw "build-7zip.ps1 failed with exit code $LASTEXITCODE" }

      - name: Save 7-Zip
        if: success() && steps.cache-sevenzip.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.hMailServerLibs }}\${{ steps.versions.outputs.sevenzip_dir }}
          key: ${{ steps.cache-sevenzip.outputs.cache-primary-key }}

      # Microsoft's installer, checked against the SHA-512 Microsoft publishes for it.
      - name: Fetch the .NET Desktop Runtime installer
        if: steps.cache-dotnet-runtime.outputs.cache-hit != 'true'
        env:
          LIB_VERSION: ${{ steps.versions.outputs.dotnet_runtime }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File libraries\fetch-dotnet-runtime.ps1 -Version $env:LIB_VERSION
          if ($LASTEXITCODE -ne 0) { throw "fetch-dotnet-runtime.ps1 failed with exit code $LASTEXITCODE" }

      - name: Save the .NET Desktop Runtime installer
        if: success() && steps.cache-dotnet-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.hMailServerLibs }}\${{ steps.versions.outputs.dotnet_runtime_dir }}
          key: ${{ steps.cache-dotnet-runtime.outputs.cache-primary-key }}

      - name: Stamp the version into the sources and the installer script
        env:
          PRODUCT_VERSION: ${{ steps.product.outputs.version }}
          PRODUCT_BUILD: ${{ steps.product.outputs.build }}
        run: |
          # Writes Version.h, the WebAdmin version check and the version and output file name
          # in section_setup_64.iss, so it has to run before the server is compiled.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\Set-Version.ps1 $env:PRODUCT_VERSION $env:PRODUCT_BUILD
          if ($LASTEXITCODE -ne 0) { throw "Set-Version.ps1 failed with exit code $LASTEXITCODE" }

      - name: Build hMailServer
        run: |
          # build.ps1 disables the pre/post build events, so the runner is spared the
          # 'NET STOP hMailServer' of a developer machine; the copy and registration half of
          # the post-build step runs separately below.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\build.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit code $LASTEXITCODE" }

      - name: Copy the runtime DLLs and register the type library
        run: |
          # The tools build their interop from hMailServer.tlb directly, so this is no longer
          # needed to compile them. It still does what the project's post-build event does on
          # a developer machine: copy the DLLs beside hMailServer.exe and register it.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\post-build.ps1 -Configuration Release -NoServiceStart
          if ($LASTEXITCODE -ne 0) { throw "post-build.ps1 failed with exit code $LASTEXITCODE" }

      - name: Build the hMailServer tools
        run: |
          # hMailAdmin, DBSetup, DBUpdater and the rest of what the installer ships: .NET 10
          # SDK-style projects, so the build restores their NuGet packages first.
          . build\Find-MsBuild.ps1
          $msbuild = Find-MsBuild
          if (-not $msbuild) { throw "MSBuild was not found." }

          $arguments = @('hmailserver\source\Tools\hMailServer Tools.sln', '/restore', '/m', '/p:Configuration=Release', '/p:Platform=x64')
          & $msbuild @arguments
          if ($LASTEXITCODE -ne 0) { throw "Building hMailServer Tools.sln failed with exit code $LASTEXITCODE" }

      # Signed here, before Inno Setup packs them: SignPath cannot open an Inno Setup
      # installer, so it can only sign what goes into it beforehand.
      - name: Stage hMailServer's own binaries for signing
        if: env.SIGNING_POLICY != 'none'
        run: |
          # Must match the "binaries" artifact configuration in SignPath. Third-party DLLs
          # are not signed with our certificate. The tools are .NET 10 applications, whose
          # code is in <tool>.dll; <tool>.exe is the .NET host that starts it.
          $files = @(
              'hmailserver\source\Server\hMailServer\x64\Release\hMailServer.exe',
              'hmailserver\source\Server\hMailServer\x64\Release\hMailServer.Minidump.exe',
              'hmailserver\source\Tools\Administrator\bin\x64\Release\hMailAdmin.exe',
              'hmailserver\source\Tools\Administrator\bin\x64\Release\hMailAdmin.dll',
              'hmailserver\source\Tools\Administrator\bin\x64\Release\Interop.hMailServer.dll',
              'hmailserver\source\Tools\Shared\bin\x64\Release\Shared.dll',
              'hmailserver\source\Tools\DBSetup\Bin\x64\Release\DBSetup.exe',
              'hmailserver\source\Tools\DBSetup\Bin\x64\Release\DBSetup.dll',
              'hmailserver\source\Tools\DBSetupQuick\bin\x64\Release\DBSetupQuick.exe',
              'hmailserver\source\Tools\DBSetupQuick\bin\x64\Release\DBSetupQuick.dll',
              'hmailserver\source\Tools\DBUpdater\Bin\x64\Release\DBUpdater.exe',
              'hmailserver\source\Tools\DBUpdater\Bin\x64\Release\DBUpdater.dll',
              'hmailserver\source\Tools\DataDirectorySynchronizer\Bin\x64\Release\DataDirectorySynchronizer.exe',
              'hmailserver\source\Tools\DataDirectorySynchronizer\Bin\x64\Release\DataDirectorySynchronizer.dll'
          )

          $stage = Join-Path $env:RUNNER_TEMP 'unsigned-binaries\Bin'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($file in $files) {
              if (-not (Test-Path $file)) { throw "$file was not built." }
              Copy-Item $file $stage
          }

          # Read back when the signed files replace the ones the installer script packs.
          $files | Set-Content (Join-Path $env:RUNNER_TEMP 'signed-files.txt')

      - name: Upload the binaries for signing
        id: upload-binaries
        if: env.SIGNING_POLICY != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-unsigned
          path: ${{ runner.temp }}/unsigned-binaries/
          if-no-files-found: error
          retention-days: 1

      # v2.3, not v3: v3's new Pipeline Connector rejects this repository with "User has no
      # access to the requested GitHub resource", even with the SignPath GitHub App installed.
      - name: Sign the binaries
        if: env.SIGNING_POLICY != 'none'
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          wait-for-completion-timeout-in-seconds: ${{ env.SIGNPATH_TIMEOUT_SECONDS }}
          artifact-configuration-slug: binaries
          # Checked against the product version of every signed file.
          parameters: |
            version: "${{ steps.product.outputs.version }}.${{ steps.product.outputs.build }}"
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          output-artifact-directory: ${{ runner.temp }}/signed-binaries

      - name: Put the signed binaries in place
        if: env.SIGNING_POLICY != 'none'
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'signed-binaries\Bin'
          foreach ($file in Get-Content (Join-Path $env:RUNNER_TEMP 'signed-files.txt')) {
              $source = Join-Path $signed (Split-Path $file -Leaf)
              # SignerCertificate rather than Status: a test certificate is not trusted here.
              if (-not (Get-AuthenticodeSignature $source).SignerCertificate) { throw "$source came back unsigned." }
              Copy-Item $source $file -Force
          }

      - name: Collect the debug symbols
        env:
          OPENSSL_DIR: ${{ steps.versions.outputs.openssl_dir }}
          POSTGRESQL_DIR: ${{ steps.versions.outputs.postgresql_dir }}
          MARIADB_DIR: ${{ steps.versions.outputs.mariadb_dir }}
        run: |
          # Symbols for the binaries hMailServer ships, so a crash dump from a CI build can be
          # read. That includes OpenSSL, libpq and libmariadb: those DLLs are built by
          # libraries\build-*.ps1 rather than downloaded, so these PDBs are the only ones that
          # match what the installer carries, and a dump taken inside one is unreadable
          # without them. Boost is linked statically, so its symbols are already in
          # hMailServer.pdb.
          $symbolDirs = @(
              'hmailserver\source\Server\hMailServer\x64\Release',
              'hmailserver\source\Server\hMailServer.Minidump\x64\Release',
              'hmailserver\source\Tools\Administrator\bin\x64\Release',
              'hmailserver\source\Tools\DBSetup\Bin\x64\Release',
              'hmailserver\source\Tools\DBSetupQuick\bin\x64\Release',
              'hmailserver\source\Tools\DBUpdater\Bin\x64\Release',
              'hmailserver\source\Tools\DataDirectorySynchronizer\Bin\x64\Release',
              'hmailserver\source\Tools\Shared\bin\x64\Release'
          )

          # Named one by one rather than globbed: these folders also hold PDBs for things the
          # installer does not ship - openssl.exe, and the vc145.pdb the compiler leaves behind.
          $libraryPdbs = @(
              "$env:OPENSSL_DIR\out64\bin\libcrypto-3-x64.pdb",
              "$env:OPENSSL_DIR\out64\bin\libssl-3-x64.pdb",
              "$env:POSTGRESQL_DIR\Release\libpq\libpq.pdb",
              "$env:MARIADB_DIR\build64\libmariadb\RelWithDebInfo\libmariadb.pdb"
          ) | ForEach-Object { Join-Path $env:hMailServerLibs $_ }

          $symbols = Join-Path $env:RUNNER_TEMP 'symbols'
          New-Item -ItemType Directory -Force -Path $symbols | Out-Null

          foreach ($dir in $symbolDirs) {
              $pdbs = @(Get-ChildItem (Join-Path $dir '*.pdb') -ErrorAction SilentlyContinue)
              if ($pdbs) { Copy-Item $pdbs.FullName $symbols } else { "No symbols in $dir" }
          }

          # These come from our own library builds at a fixed path, so a missing one means the
          # layout or the cache pruning changed and the symbols would silently degrade.
          foreach ($pdb in $libraryPdbs) {
              if (-not (Test-Path $pdb)) { throw "Expected library symbols were not found: $pdb" }
              Copy-Item $pdb $symbols
          }

          # The server's own symbols are the ones that matter; missing those means the
          # Release build did not produce a PDB, which is worth failing over.
          if (-not (Test-Path (Join-Path $symbols 'hMailServer.pdb'))) { throw "hMailServer.pdb was not produced by this build." }

          Get-ChildItem $symbols | Select-Object Name, Length | Format-Table -AutoSize | Out-String

      - name: Upload the symbols for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbols-untested
          path: ${{ runner.temp }}/symbols
          if-no-files-found: error
          # Job-to-job plumbing, not a deliverable: the publish job re-uploads these under
          # their release name, which is the copy that keeps the default 90 days.
          retention-days: 1

      - name: Install Inno Setup
        id: innosetup
        run: |
          function Get-InnoSetup {
              Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                               'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                  Where-Object { $_.DisplayName -like 'Inno Setup*' } | Select-Object -First 1
          }

          $installed = Get-InnoSetup
          if ($installed.DisplayVersion -ne $env:INNOSETUP_VERSION) {
              $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNOSETUP_VERSION.exe"
              $tag = 'is-' + ($env:INNOSETUP_VERSION -replace '\.', '_')
              $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNOSETUP_VERSION.exe"
              "Downloading $url (the image has '$($installed.DisplayVersion)')"
              Invoke-WebRequest -Uri $url -OutFile $setup

              $hash = (Get-FileHash -Path $setup -Algorithm SHA256).Hash
              if ($hash -ne $env:INNOSETUP_SHA256) {
                  throw "The SHA-256 of $url is $hash, but $env:INNOSETUP_SHA256 is pinned for it."
              }

              # The installer marks its files ignoreversion, so it replaces a different
              # version already on the image in either direction.
              $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "The Inno Setup installer failed with exit code $($process.ExitCode)." }
              $installed = Get-InnoSetup
          }

          if ($installed.DisplayVersion -ne $env:INNOSETUP_VERSION) {
              throw "Inno Setup $env:INNOSETUP_VERSION was requested, but the installed version is '$($installed.DisplayVersion)'."
          }

          $iscc = Join-Path $installed.InstallLocation 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found at $iscc." }
          "Inno Setup $($installed.DisplayVersion): $iscc"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "iscc=$iscc"

      - name: Locate the Visual C++ redistributables
        id: redist
        run: |
          # The installer ships the C++ runtime beside hMailServer.exe, and it must not be
          # older than the toolset that compiled it. These DLLs used to be checked into the
          # repository at 14.25 (VS2019 16.5) and were left behind when the build moved to
          # VS2022, whose v142 toolset is 14.29 - so they are taken from the installed
          # toolset now, and the two can no longer drift apart.
          #
          # The installer requires Windows 10, and Microsoft's advice is to ship the latest
          # available runtime, so the newest installed one is shipped. Windows 10 and later
          # have the Universal CRT built in, so only the Visual C++ runtime itself is needed.
          . build\Get-VCRedistPath.ps1
          $redist = Get-VCRedistPath -MinimumVersion $env:REDIST_MIN_VERSION -Newest
          if (-not $redist) {
              throw "No Visual C++ redistributable of $env:REDIST_MIN_VERSION or later was found. hMailServer.exe is compiled with the $env:REDIST_MIN_VERSION toolset and must not ship an older runtime."
          }

          # Whatever the runner image carries. Worth a look when it changes: the Windows 10
          # floor holds for every 14.x redistributable Microsoft has shipped so far, but a
          # future one raising it would need the installer's MinVersion raised too.
          "Shipping the runtime from $redist"
          Get-ChildItem $redist -File |
              Select-Object Name, @{ Name = 'Version'; Expression = { $_.VersionInfo.FileVersion } } |
              Format-Table -AutoSize | Out-String

          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$redist"

      - name: Build the installer
        env:
          VCREDIST_PATH: ${{ steps.redist.outputs.path }}
          ISCC: ${{ steps.innosetup.outputs.iscc }}
        run: |
          & $env:ISCC "/DHMAILSERVERLIBS=$env:hMailServerLibs" "/DVCREDIST_PATH=$env:VCREDIST_PATH" hmailserver\installation\hMailServer64.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed with exit code $LASTEXITCODE" }

          # The script sets no OutputDir, so Inno Setup writes to Output next to it.
          $setup = Get-ChildItem 'hmailserver\installation\Output\*.exe' -ErrorAction SilentlyContinue
          if (-not $setup) { throw "ISCC.exe produced no setup executable." }
          $setup | Select-Object Name, Length | Format-Table -AutoSize | Out-String

      # Signed before the tests, so they run against the installer that is published.
      - name: Upload the installer for signing
        id: upload-installer
        if: env.SIGNING_POLICY != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-unsigned
          path: hmailserver/installation/Output/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer
        if: env.SIGNING_POLICY != 'none'
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          wait-for-completion-timeout-in-seconds: ${{ env.SIGNPATH_TIMEOUT_SECONDS }}
          artifact-configuration-slug: installer
          parameters: |
            version: "${{ steps.product.outputs.version }}.${{ steps.product.outputs.build }}"
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          output-artifact-directory: ${{ runner.temp }}/signed-installer

      - name: Put the signed installer in place
        if: env.SIGNING_POLICY != 'none'
        run: |
          foreach ($setup in Get-ChildItem 'hmailserver\installation\Output\*.exe') {
              $source = Join-Path $env:RUNNER_TEMP "signed-installer\$($setup.Name)"
              if (-not (Get-AuthenticodeSignature $source).SignerCertificate) { throw "$source came back unsigned." }
              Copy-Item $source $setup.FullName -Force
          }

      # Under a name that says it has not been tested yet. The regression tests run
      # against this artifact in the next job, and only if they pass does the publish job
      # re-upload it under the release name. An artifact is the only way to move a file
      # between jobs, so the run ends up carrying the installer twice - which is the price
      # of testing it on a machine that did not build it.
      - name: Upload the installer for testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-untested
          path: hmailserver/installation/Output/*.exe
          if-no-files-found: error
          # As with the symbols: this copy only has to survive until the publish job has
          # re-uploaded it, so it does not sit in the run's storage for 90 days as well.
          retention-days: 1

      - name: Upload the library build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: library-build-logs
          path: libraries/build-*.log
          if-no-files-found: ignore

  # A separate job, so the tests get a clean runner: nothing of the build is on it except
  # the installer, which is what a user would get. The publish job below waits for this,
  # so a failing suite stops the installer from being released.
  test:
    # The called workflow names the job that actually runs, and the web UI shows the two
    # together - so this one names the stage rather than repeating it.
    name: Tests
    needs: build
    uses: ./.github/workflows/tests.yml
    with:
      installer-artifact: installer-untested
      runner-image: ${{ needs.build.outputs.runner-image }}

  # The same suite against the PostgreSQL server of the runner image. The MySQL and
  # PostgreSQL connections write their command parameters into the SQL rather than bind
  # them, which the internal database never exercises. Not yet something the publish job
  # waits for: this run establishes the PostgreSQL baseline first.
  test-postgresql:
    name: Tests (PostgreSQL)
    needs: build
    uses: ./.github/workflows/tests.yml
    with:
      installer-artifact: installer-untested
      runner-image: ${{ needs.build.outputs.runner-image }}
      database: postgresql

  # And against the MySQL server of the runner image, for the same reason, and like the
  # PostgreSQL run not yet one the publish job waits for.
  test-mysql:
    name: Tests (MySQL)
    needs: build
    uses: ./.github/workflows/tests.yml
    with:
      installer-artifact: installer-untested
      runner-image: ${{ needs.build.outputs.runner-image }}
      database: mysql

  publish:
    name: Publish the installer
    needs: [build, test]
    runs-on: ubuntu-latest
    # Four artifact transfers and nothing else. The default of six hours would let a stuck
    # download hold a runner for most of a day before anyone noticed.
    timeout-minutes: 15
    # The only job in either workflow that needs more than a read-only token, and only for
    # the attestation below: id-token to get the short-lived signing certificate, attestations
    # to record the result against the repository.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the tested installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-untested
          path: installer

      # The installer is a downloadable executable, and this is what lets someone check that a
      # given setup.exe came out of this repository and this workflow rather than from
      # somewhere else: `gh attestation verify ArzoieMail-...-Setup.exe -R jassifx/arzoiemail`.
      # It signs the file's digest, so it has to run on the copy that is published.
      - name: Attest the installer's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installer/*.exe

      - name: Upload the installer under its release name
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ArzoieMail-${{ needs.build.outputs.version }}-B${{ needs.build.outputs.build }}-x64-Setup
          path: installer/*.exe
          if-no-files-found: error

      - name: Download the symbols
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: symbols-untested
          path: symbols

      - name: Upload the symbols under their release name
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ArzoieMail-${{ needs.build.outputs.version }}-B${{ needs.build.outputs.build }}-x64-Symbols
          path: symbols/*.pdb
          if-no-files-found: error
